<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The owl for small places: what a PDF wears in the Finder while Moonowl is
       its reader, and the 16 to 48 pixel frames of `icon.ico` and the 32 pixel
       PNG. It is the head of the owl in `app-icon.svg` and nothing else, in a
       heavier line, because at those sizes the whole bird on its scroll is a
       grey smudge. It was a sheet with its corner turned down, and at Finder
       sizes that read as the system's blank page. The head's points are
       restated from `app-icon.svg` (resvg follows no `use` into another file),
       so a change to the owl's face is a change in both. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="30" x2="0" y2="994" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f3ea"/>
      <stop offset="1" stop-color="#ece5d7"/>
    </linearGradient>
    <g id="half" fill="none" stroke="#3f4b66" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-400 L95,-385 L165,-320 L185,-230 L180,-150 L70,-60 L0,10"/>
      <path d="M0,-315 L60,-345 L130,-300 L150,-230 L110,-170 L0,-140 L70,-60 L110,-170"/>
    </g>
  </defs>
  <rect x="42" y="42" width="940" height="940" rx="216" fill="url(#ground)" stroke="#3f4b66" stroke-width="24"/>
  <g transform="translate(512,873) scale(1.85)">
    <use href="#half"/>
    <use href="#half" transform="scale(-1,1)"/>
    <path d="M0,-225 L30,-198 L0,-155 L-30,-198 Z" fill="#3f4b66" stroke="#3f4b66" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="75" cy="-255" r="26" fill="#3f4b66"/>
    <circle cx="-75" cy="-255" r="26" fill="#3f4b66"/>
  </g>
</svg>
