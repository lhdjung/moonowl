# Solarized Dark — Ethan Schoonover's palette, the dark half. Body text is in
# base1, a step brighter than the palette's own body tone, base0, as the light
# half's is a step darker: base0 is 4.7:1 on base03.
name = "Solarized Dark"
text = "#93a1a1"
background = "#002b36"
# Solarized blue, its own accent.
accent = "#268bd2"
# Solarized cyan for links, next to the blue accent rather than on top of it —
# lightened, because the palette's own is lost against base03.
link = "#3cc2b7"
# base02, the palette's own highlight, is one shade up from base03 — deliberately
# almost invisible, because Solarized means it for a highlighted line and not for
# a highlighted sentence. Here it left a selection you had to hunt for, so this
# is base03 carried towards the palette's blue instead, with base2 as the ink.
selection_area = "#0d4d6d"
selection_text = "#eee8d5"
