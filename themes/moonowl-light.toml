# Moonowl Light — the default theme.
# `recolor = false`: the document is shown exactly as printed, links included.
# `text`, `background` and `accent` colour the app's interface; the selection
# pair colours what you select and what a search finds. A `link` would mean
# nothing here, so there is none.
name = "Moonowl Light"
order = 1
text = "#2f3237"
# The app icon's ground, top to bottom: the lighter cream for the bar and
# everything the interface draws, the deeper one around the pages.
background = "#f8f3ea"
# Moss: a warm green that sits in the cream, so its tints stay cream too.
accent = "#647a35"
# A pale rose: the one hue the interface uses for nothing else, so a selection
# reads as a mark on the page rather than as more app.
selection_area = "#eac8c2"
selection_text = "#2f3237"
recolor = false
ground = "#ece5d7"
