# Moonowl Light — the default theme.
# `recolor = false`: the document is shown exactly as printed, links included.
# `text`, `background` and `accent` colour the app's interface; the selection
# pair colours what you select and what a search finds. A `link` would mean
# nothing here, so there is none.
name = "Moonowl Light"
text = "#2f3237"
# Stone: a warm grey without the yellow of cream. The lighter one is for the
# bar, the menus and everything else the interface draws, and the deeper one
# is around the pages.
background = "#f6f5f3"
# Terracotta: a warm reddish brown that suits the warm greys. It is darker and
# less saturated than the red of a delete button, so the two are not confused.
accent = "#a84b33"
# A pale rose, so that a selection reads as a mark on the page.
selection_area = "#eac8c2"
selection_text = "#2f3237"
recolor = false
surround = "#e8e6e2"
