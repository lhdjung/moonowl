# Dark Forest — a lamp-lit clearing: firefly-yellow ink on a deep, mossy green.
# The green leans warm, towards olive, so the page glows rather than chills.
name = "Dark Forest"
# Warm, candle-yellow type, soft enough to read by for an hour.
text = "#f4dc9a"
background = "#1c2a1d"
# Ember orange for the chrome.
accent = "#f2994a"
# A glowing pink coral. It is pinker than the orange accent and the yellow
# text, so a link is not mistaken for either.
link = "#ff9f9f"
# Banked embers behind a selection, with the page's own glow on top.
selection_area = "#a8482a"
selection_text = "#fff0c8"
