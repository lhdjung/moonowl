# Moonowl Dark — the default dark theme.
# Not pure black on white: that contrast is tiring to read for long stretches.
name = "Moonowl Dark"
text = "#e9eaee"
background = "#24272f"
# Brick rose: a soft red with the selection's hue, lighter, so the two belong
# together. It is warm, like the links, and leaves cold accents to Tokyo Night
# and Nord.
accent = "#c57a77"
# Moonowl Light's copper, made lighter for a dark page. It is not the accent,
# which the interface uses, and not the selection's red, which is kept for
# what the reader selects.
link = "#f5c49c"
# The same warm red as Moonowl Light's, darkened to sit on a dark page. A red
# band is seen at a glance, where a lighter shade of the background is not.
# The text on it is a warm off-white rather than the theme's own cool white,
# which would clash with the band under it.
selection_area = "#7a4247"
selection_text = "#f8eeec"
