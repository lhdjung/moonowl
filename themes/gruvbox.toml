# Gruvbox, for the oldies. Retro groove, warm and low-glare.
name = "Gruvbox"
text = "#ebdbb2"
background = "#282828"
accent = "#fe8019"
# Gruvbox's bright aqua for links. It is green beside the cream text and the
# orange accent, so a link is not mistaken for either.
link = "#8ec07c"
# Gruvbox selects with bg3, a warm grey — which is a colour chosen to sit
# behind a cursor rather than behind a sentence, and reads as nothing at all
# once it is the paper. This is the palette's orange banked into the ground
# instead: burnt, retro, and unmistakably which theme you are in.
selection_area = "#8f5010"
selection_text = "#fbf1c7"
# bg0_h, the palette's hard background.
surround = "#1d2021"
