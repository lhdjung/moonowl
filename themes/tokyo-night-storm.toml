# Tokyo Night Storm — the softer-contrast sibling of Tokyo Night: same ink and
# the same accents, a lighter ground.
name = "Tokyo Night Storm"
text = "#a9b1d6"
background = "#24283b"
accent = "#7aa2f7"
# Purple for links, clear of the blue accent beside it.
link = "#bb9af7"
# The palette's selection blue for Storm, made lighter so that a selection
# can be seen on the background. The text on it is set here: if it were
# derived, it would be a warm sand, which neither variant contains. It is fg,
# the brighter of the palette's two text colours.
selection_area = "#3b4f8a"
selection_text = "#c0caf5"
# bg_dark, the palette's own ground for panels.
surround = "#1f2335"
