# Dim Paper: a light theme for documents whose white is too bright. The page is
# recoloured to a cool, mid-light grey with near-black text. It is dimmer than
# Sepia and has none of its warmth.
name = "Dim Paper"
text = "#1f2124"
background = "#d4d6d8"
# A muted teal, quiet enough for a theme that is mostly grey.
accent = "#2f5a5a"
# A plain blue, so a link is told apart from the teal accent.
link = "#2a5585"
# A darker shade of the same grey, with the page's own text on it.
selection_area = "#b9c0c7"
selection_text = "#1f2124"
surround = "#c4c7ca"
