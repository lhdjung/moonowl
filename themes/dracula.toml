# Dracula, translated for reading.
# The real Dracula palette uses #f8f8f2 for body text and keeps pink (#ff79c6),
# purple (#bd93f9) and cyan (#8be9fd) for accents. Pink body text over a full
# page is exhausting, so the pink lives in the accent here, the way it does in
# every editor theme that ships Dracula.
name = "Dracula"
text = "#f8f8f2"
background = "#282a36"
accent = "#ff79c6"
# Cyan for links, as in the palette proper.
link = "#8be9fd"
# Not the palette's own "current line" grey, which is a background colour and
# disappears when it becomes a selection: the pink itself, at full strength.
# Dracula is the one theme here loud enough to carry it.
selection_area = "#e35fe8"
# The palette's own darker ground, which editors put behind their sidebars.
ground = "#21222c"
