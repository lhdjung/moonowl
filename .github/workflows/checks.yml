# The suite, on the three platforms it ships to, as a workflow of its own so
# that CI and a release run exactly the same one. A release that skips them is
# a release nobody checked, and a second copy here would be a copy that drifts.
#
# Nothing in it needs a GPU, a screen or a compositor: the reader builds a
# `DioxusDocument`, resolves style and layout against a stated viewport, and
# draws pages through pdfium into `ImageData` on the CPU. What it cannot cover
# is the window — the shell, the cascade, full screen, the Dock menu, the
# socket; `src/windows.rs` is what makes that a small hole.

name: Checks

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # The pdfium build this is measured against. Written the way the download URL
  # wants it — the tag is `chromium/8021` and the slash is a path separator to
  # GitHub unless it is escaped.
  PDFIUM_TAG: "chromium%2F8021"

jobs:
  suite:
    # The workflow is "Checks" and the job is the platform it ran on, so a
    # failure reads as "checks / ubuntu-latest" — which is the whole of what
    # anybody wants from the name.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Neither platform's answer is worth losing because another one failed.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pdfium: pdfium-mac-arm64.tgz
            # Where the archive keeps the library, which is not the same on all
            # three: Windows puts the DLL in `bin/` and its import library in
            # `lib/`, and `Pdfium::pdfium_platform_library_name_at_path` wants
            # the directory holding the thing that is actually loaded.
            lib: lib
          - os: ubuntu-latest
            pdfium: pdfium-linux-x64.tgz
            lib: lib
          - os: windows-latest
            pdfium: pdfium-win-x64.tgz
            lib: bin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          # Two workspaces, two lockfiles: the spike is one of its own and is
          # checked at the end of this job.
          workspaces: |
            .
            experiments/dioxus-spike

      # fontique reads the system's fonts through fontconfig on Linux, and
      # `yeslogic-fontconfig-sys` looks for it with pkg-config at build time —
      # so without the development package the build fails long before any test
      # runs, with a panic out of a build script. `RUST_FONTCONFIG_DLOPEN=1` is
      # that crate's own escape from needing it and is not one here: it changes
      # the crate's API surface enough that `fontique` no longer compiles
      # against it. The fonts themselves matter for a different reason: the
      # toolbar is drawn in whatever `ui-sans-serif` resolves to, and a runner
      # with no fonts at all lays out a document of empty boxes.
      - name: What fontconfig needs, and something to draw with
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev fonts-dejavu-core

      # No step writes `Reader::book()`. The 400-page fixture is written by
      # `fixture::book_pdf` on first use, which is the rule the rest of the
      # suite already follows: `cargo test` needs cargo and nothing else.

      # pdfium is a shared library and is not in this repository — `pdfium.rs`
      # finds it beside the executable in a bundle and through `MOONOWL_PDFIUM`
      # here. Every path below is relative and the one absolute path is
      # GitHub's own, because bash on the Windows runner reports `RUNNER_TEMP`
      # as a Windows path with backslashes in it and cargo's environment wants
      # something a Rust `Path` can open.
      - name: pdfium
        shell: bash
        run: |
          mkdir -p pdfium
          curl -sSfL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/${{ matrix.pdfium }}"
          tar xzf pdfium.tgz -C pdfium
          echo "MOONOWL_PDFIUM=${{ github.workspace }}/pdfium/${{ matrix.lib }}" >> "$GITHUB_ENV"

      # Clippy on one runner rather than three: it is the same source and the
      # same lints, and the two things that actually differ between platforms —
      # `cfg(unix)` in `single.rs` and `cfg(target_os = "macos")` in `dock.rs`
      # and `stats.rs` — are compiled by the test build on each of them anyway.
      #
      # There is deliberately no `cargo fmt --check`. The keymap is one row per
      # action so that it can be read down, the macro above it is one line per
      # arm, and rustfmt explodes both.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      # `--no-fail-fast`: plain `cargo test` stops at the first test binary
      # that fails, so a platform with three broken files showed one per push.
      - name: Tests
        run: cargo test --no-fail-fast

      # Phase 0's four spikes are answers rather than tests — they open windows
      # and measure things — so there is nothing here to run. Checking that they
      # still compile is what keeps the pinned Blitz revision honest for them
      # too.
      - name: The spike still compiles
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path experiments/dioxus-spike/Cargo.toml --bins
