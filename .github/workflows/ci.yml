# Every pull request: the suite on macOS, Linux and Windows. It checks; it
# does not release. `release.yml` is the switch for that, and it calls the same
# `checks.yml` before it bundles anything.
#
# A push to main is checked by `nightly.yml`, which builds the installers
# beside the checks and publishes them as the rolling `nightly` release only
# when both pass. Running the suite here as well would run it twice.

name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
