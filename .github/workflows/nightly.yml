# **The rolling build, and the only thing that makes a download link out of a
# push.** Workflow artifacts are not that: they expire, they cannot be fetched
# without a GitHub account, and GitHub re-zips them. A release asset is a plain
# URL anybody can click.
#
# Every push to main replaces the `nightly` release with a build of that
# commit. It does not wait for `ci.yml`: the checks run on the same push, in
# parallel, and waiting would put fifty minutes between a merge and a
# downloadable build. A nightly that fails its tests is replaced by the next
# push; a nightly nobody can download is no use at all.
#
# It is marked `--latest`, which is the only thing the repository's front page
# reads: it shows the newest release that is neither a draft nor a prerelease.
# A nightly marked prerelease would leave the front page pointing at nothing at
# all today, and at a months-old version later. Newest wins, tag or main.
#
# **The build is staged, then swapped in.** The installers take tens of
# minutes, and the release they replace used to be deleted before the first of
# them started — every `releases/latest/download/…` link in the README was a
# 404 for that long after every push, and for good if one platform failed. So
# the new build goes into a draft under a tag of its own, `nightly-next`, and
# only once all four bundles are in does one job take the old release down and
# turn the draft into `nightly`. A push that cancels this run leaves the last
# good nightly where it was. `nightly` does not match `v*`, and a tag pushed
# with `GITHUB_TOKEN` starts no workflow anyway, so there is no loop here.

name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first is still packaging would delete the release the
# first is uploading into.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  open:
    name: Stage the release
    runs-on: ubuntu-latest
    steps:
      - name: A draft to build into
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The body is the download list `bundle.yml` writes once the
          # installers exist; until then, nothing — a line about which commit
          # this was built from is for us, not for the person downloading.
          : > notes.md
          # What a cancelled run left behind, and then the tag the bundles
          # check out — `bundle.yml` builds the ref it is handed.
          gh release delete nightly-next --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-next" >/dev/null 2>&1 || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/nightly-next -f sha="$GITHUB_SHA" >/dev/null
          gh release create nightly-next \
            --verify-tag \
            --draft \
            --title "Development build" \
            --notes-file notes.md

  bundle:
    needs: open
    uses: ./.github/workflows/bundle.yml
    with:
      tag: nightly-next
    permissions:
      contents: write

  swap:
    name: Swap it in
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: The draft becomes nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The old one goes only now, a moment before its replacement is
          # published, and the tag is made again at this commit: a stale one
          # would hang this build off an older ref.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" >/dev/null 2>&1 || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          gh release edit nightly-next --tag nightly --draft=false --latest
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-next" >/dev/null 2>&1 || true
