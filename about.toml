# What `cargo about` may list: the licences the crates in Cargo.lock carry.
# A crate under any other licence makes `cargo about generate` fail, in
# bundle.yml and in the install scripts, and that is the moment to decide
# whether it can ship. See THIRD-PARTY.md.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
# The four the bundles are built for, so that a crate used on one platform
# only is listed too.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Moonowl itself is not a third party.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
