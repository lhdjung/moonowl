# Moonowl keys
#
# Every action Moonowl listens for is in here, with the keys it ships with.
# The lines are commented out, which means "keep the keys you shipped with".
# Uncomment one, put the keys you want in it, and that action answers to
# those instead. An empty list takes the action off the keyboard entirely.
#
# Where a Mac ships with different keys from Windows and Linux, the action has
# two lines, each saying which machine it is for. Uncomment the one for yours.
#
# Leave alone anything you are happy with, rather than uncommenting the lot:
# a line you have not touched still picks up a key a later version of Moonowl
# adds, and a line you have frozen never will.
#
# This file is read when Moonowl starts, and again when you press Reload on
# the Keyboard page in Settings — which is also where you can see what is in
# force right now, including anything below that could not be read.
#
# ─── how a key is written ────────────────────────────────────────────────
#
#   mod      ⌘ on a Mac, Ctrl on Windows and Linux
#   ctrl     the Control key itself — which on Windows and Linux is `mod`
#   alt      ⌥ / Alt
#   shift
#
# Modifiers come first, joined with +, then the key itself: a letter, a
# digit, a punctuation mark, or one of
#
#   escape  space  enter  tab  backspace  delete
#   left  right  up  down  pageup  pagedown  home  end  f1 … f12
#
# So: "mod+f", "mod+shift+g", "alt+left", "escape", "j", "f11", "mod++".
# Two keys with a space between them are pressed one after the other: "g g".
#
# A key does one thing. Give the same one to two actions and Moonowl keeps the
# one you wrote, drops the one it shipped with, then says so on the Keyboard
# page. Same for a key that would have to wait to find out what it means: bind
# "g" to something and "g g" stops working.

# ─── documents ───────────────────────────────────────────────────────────

# open = ["mod+o"]
# Two documents at once means two windows. A window is a whole second reader,
# and the settings, themes and reading history stay shared between them.
# new-window = ["mod+n"]
# A tab of the window in front, which macOS has and the other two do not.
# new-tab = ["mod+t"]  # Mac
# new-tab = []  # Windows and Linux
# print = ["mod+p"]
# settings = ["mod+,"]
# help = ["f1", "mod+/"]
# Two of them, because there is more than one window: ⌘W closes this one — or
# this tab, on a Mac, there being no other way to shut one — and ⌘Q closes them
# all. A Mac's is empty because the application menu macOS puts up already
# answers ⌘Q; on Windows and Linux there is no menu bar, so Moonowl listens.
# close-window = ["mod+w"]
# quit = []  # Mac
# quit = ["mod+q"]  # Windows and Linux
# minimize = ["mod+m"]
# Window tabs are macOS's and exist nowhere else — which is why Ctrl+1 and
# Ctrl+2 still mean actual size and fit the page on the other two. Nine
# chords, one action: the digit that was pressed is the tab that was asked for.
# go-to-tab = ["mod+1", "mod+2", "mod+3", "mod+4", "mod+5", "mod+6", "mod+7", "mod+8", "mod+9"]  # Mac
# go-to-tab = []  # Windows and Linux
# The tab beside this one, as in every Mac application.
# previous-tab = ["mod+shift+["]  # Mac
# previous-tab = []  # Windows and Linux
# next-tab = ["mod+shift+]"]  # Mac
# next-tab = []  # Windows and Linux
# find = ["mod+f"]
# find-next = ["mod+g"]
# find-previous = ["mod+shift+g"]
# select-page = ["mod+a"]
# copy = ["mod+c"]
# copy-quote = ["mod+shift+c"]
# undo = ["mod+z"]
# redo = ["mod+shift+z"]  # Mac
# redo = ["mod+shift+z", "mod+y"]  # Windows and Linux
# mark = ["mod+shift+b"]
# markup = ["mod+shift+h"]
# dismiss = ["escape"]

# ─── moving around ───────────────────────────────────────────────────────

# next-page = ["right", "l"]
# previous-page = ["left", "h"]
# scroll-down = ["down", "j"]
# scroll-up = ["up", "k"]
# Sideways, on a page wider than the window.
# scroll-left = ["shift+left", "shift+h"]
# scroll-right = ["shift+right", "shift+l"]
# Vim spells these ⌃D and ⌃U. That spelling cannot ship, because on Windows
# and Linux Ctrl is `mod` and ⌃D is already dark mode there. On a Mac it is
# free: half-screen-down = ["d", "ctrl+d"]
# half-screen-down = ["d"]
# half-screen-up = ["u"]
# A Mac's keyboard often has no Page Down, Home or End, so it answers ⌥↓ and ⌥↑
# for a screen, and ⌘↑ and ⌘↓ for the first and last page, as other Mac
# applications do.
# screen-down = ["space", "pagedown", "alt+down"]  # Mac
# screen-down = ["space", "pagedown"]  # Windows and Linux
# screen-up = ["shift+space", "pageup", "alt+up"]  # Mac
# screen-up = ["shift+space", "pageup"]  # Windows and Linux
# first-page = ["home", "g g", "mod+up"]  # Mac
# first-page = ["home", "g g", "mod+home"]  # Windows and Linux
# last-page = ["end", "shift+g", "mod+down"]  # Mac
# last-page = ["end", "shift+g", "mod+end"]  # Windows and Linux
# The page field is on p, because g belongs to gg and G. Putting it back on g
# would leave gg unreachable: a key cannot both act at once and wait to see
# what follows it.
# go-to-page = ["mod+alt+g", "p"]
# back = ["mod+[", "alt+left"]
# forward = ["mod+]", "alt+right"]

# ─── looking at it ───────────────────────────────────────────────────────

# zoom-in = ["mod++", "mod+="]
# zoom-out = ["mod+-"]
# fit-width = ["mod+0"]
# The interface — toolbar, menus, windows — larger, smaller, and as it was.
# ui-larger = ["mod+alt+=", "mod+alt++"]
# ui-smaller = ["mod+alt+-"]
# ui-reset = ["mod+alt+0"]
# ⌘1 and ⌘2 belong to the window tabs on a Mac. See `go-to-tab` above.
# actual-size = ["mod+alt+1"]  # Mac
# actual-size = ["mod+1"]  # Windows and Linux
# fit-page = ["mod+alt+2"]  # Mac
# fit-page = ["mod+2"]  # Windows and Linux
# rotate-right = ["mod+r"]
# rotate-left = ["mod+l"]
# dark = ["mod+d"]
# sidebar = ["mod+b"]
# menu-bar = ["mod+shift+m"]
# ⌃⌘F is what macOS itself uses; F11 is Show Desktop there.
# fullscreen = ["mod+shift+f", "mod+ctrl+f"]  # Mac
# fullscreen = ["mod+shift+f", "f11"]  # Windows and Linux
# present = ["mod+shift+p"]
# Off the keyboard by default, because a stray key would change them for good:
# the spread is a setting, and fifteen themes is fourteen presses back.
# spread = []
# next-theme = []
